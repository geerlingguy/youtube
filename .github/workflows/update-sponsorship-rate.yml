---
name: Update Sponsorship Rate

'on':
  schedule:
    # Every Monday at 12:00 UTC.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Calculate rate and update README
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 scripts/calculate_sponsorship_rate.py --update-readme README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "Update sponsorship rate ($(date -u +%Y-%m-%d))."
            git push
          else
            echo "No changes to commit."
          fi
